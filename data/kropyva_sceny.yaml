title: "Кропива: сцени"
questions:
- question: Що означає ключ на значку сцени?
  image: /imgs/scenes_local.png
  options:
  - Сцена локальна (приватна), її об'єкти доступні тільки з цього пристрою
  - Сцена захищена паролем
  - Сцена групова, нею користуються кілька пристроїв
  correct_answer: 0

- question: Як у списку сцен відрізнити групову сцену?
  options:
  - На її значку немає ключа
  - На її значку є ключ
  - Її назва написана червоним
  correct_answer: 0
  stick_to_the_previous: true

- question: Об'єкти якої сцени можна редагувати?
  options:
  - Будь-якої сцени, у якої увімкнене відображення
  - Тільки поточної сцени
  - Усіх сцен на пристрої
  correct_answer: 1

- question: Як на мапі показуються об'єкти інших сцен, у яких увімкнене відображення?
  options:
  - Так само, як об'єкти поточної сцени
  - Ніяк, видно тільки поточну сцену
  - Напівпрозоро, і їх не можна вибрати чи редагувати
  correct_answer: 2

- question: Що робить кнопка, виділена на зображенні?
  image: /imgs/scenes_eye.png
  options:
  - Вмикає або вимикає показ сцени на мапі
  - Відкриває сцену для редагування
  - Ховає сцену зі списку назавжди
  correct_answer: 0

- question: Що робить кнопка, виділена на зображенні?
  image: /imgs/scenes_add.png
  options:
  - Додає нову ціль
  - Створює нову сцену або імпортує сцену з файлу
  - Додає учасника до групової сцени
  correct_answer: 1

- question: Що робить кнопка, виділена на зображенні?
  image: /imgs/scenes_multi.png
  options:
  - Позначає всі повідомлення прочитаними
  - Дозволяє вибрати кілька сцен, щоб змінити їм тег або видалити приватні сцени
  - Об'єднує кілька сцен в одну
  correct_answer: 1

- question: Яка кнопка відкриває це меню сцени?
  image: /imgs/scene_menu.png
  options:
  - /imgs/main_tl_menu.png
  - /imgs/main_tl_scene.png
  - /imgs/main_tr_settings.png
  correct_answer: 1

- question: Що відкриває кнопка, виділена на зображенні?
  image: /imgs/scene_menu_export.png
  options:
  - Сортування об'єктів сцени
  - Меню експорту та імпорту сцени
  - Синхронізацію з побратимами
  correct_answer: 1

- question: Що з цього списку можна експортувати БЕЗ пароля?
  image: /imgs/scene_export.png
  options:
  - Експортувати сцену
  - Експортувати цілі та орієнтири
  - Експорт об'єктів ієрархії
  correct_answer: 1

- question: Чим «Експорт об'єктів ієрархії» відрізняється від «Експортувати сцену»?
  options:
  - Він не експортує об'єкти тактики
  - Він не потребує пароля
  - Він експортує тільки треки
  correct_answer: 0
  stick_to_the_previous: true

- question: Де змінюють назву групової сцени?
  options:
  - У налаштуваннях сцени в «Кропива Мапа»
  - У додатку «Тенета Групи»
  - Назву групової сцени змінити не можна
  correct_answer: 1

- question: У яких сценах є пункт «Розсилка об'єктів сцени»?
  options:
  - Тільки в групових
  - Тільки в локальних
  - В усіх сценах
  correct_answer: 0

- question: Вам треба отримати нові зміни в груповій сцені. Хто має зробити «Розсилку об'єктів сцени»?
  options:
  - Ви на своєму пристрої
  - Побратими на своїх пристроях
  - Адміністратор у «Тенета Групи»
  correct_answer: 1
  stick_to_the_previous: true

- question: Скільки днів транспорт TenetaCloud зберігає зміни групової сцени? Введіть число.
  correct_value: "7"
  checker: |
    assert to_int(user_answer) == 7, 'Правильна відповідь: 7 днів'

- question: Ви виявили ворожий міномет УПІК-82. Як його додати в бойовий порядок?
  options:
  - Як ціль з типом «міномет», а в описі вказати УПІК-82
  - Як вогневу позицію (ВП)
  - Як орієнтир
  correct_answer: 0

- question: Що автоматично записується в чат сцени?
  options:
  - Нічого, туди пишуть тільки повідомлення
  - Зміни об'єктів сцени, і з цих записів можна відновити попередній стан об'єкта
  - Координати всіх учасників кожну хвилину
  correct_answer: 1

- question: Чи можна відновити сцену з резервної копії?
  options:
  - Так, резервні копії створюються автоматично для кожної сцени
  - Тільки якщо перед цим зробити експорт сцени
  - Ні, видалені дані не відновлюються
  correct_answer: 0

randomize_questions: false
show_answers_on_completion: false
show_right_answer: true
