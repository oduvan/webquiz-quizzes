  - Видалити ціль і створити нову
  correct_answer: 0

- question: Ви поставили цілевказівник у нове місце. Як перенести туди ціль?
  options:
  - Натиснути «Дискету»
  - Натиснути кнопку цілевказівника в полі координат формуляра цілі
