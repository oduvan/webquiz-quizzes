title: "Кропива: циркуль і радіолінк"
questions:
- question: "Циркуль показує «↑Пн 4710, ←Зх 199». Що це означає?"
  image: /imgs/radio_panel.png
  options:
  - Друга точка на 4710 м північніше і на 199 м західніше від першої
  - Перша точка на 4710 м північніше і на 199 м західніше від другої
  - Висота точок над рівнем моря
  correct_answer: 0

- question: "Циркуль показує «Δ висот: -48 м». Яка точка вище?"
  image: /imgs/radio_panel.png
  options:
  - Початкова
  - Цільова
  - На одній висоті
  correct_answer: 0
  stick_to_the_previous: true

- question: Що робить кнопка із замком, виділена на зображенні?
  image: /imgs/radio_lock.png
  options:
  - Блокує екран
  - Закріплює відрізок циркуля на мапі, щоб далі працювати з картою
  - Ставить пароль на сцену
  correct_answer: 1

- question: Що робить кнопка «+», виділена на зображенні?
  image: /imgs/radio_add.png
  options:
  - Збільшує масштаб карти
  - Додає ціль
  - Додає ще один відрізок циркуля від поточної точки
  correct_answer: 2

- question: Що вмикає кнопка, виділена на зображенні?
  image: /imgs/radio_widget_btn.png
  options:
  - Віджет розрахунку радіолінку зі зрізом висот прямо на карті
  - Карту висот
  - Пряму видимість
  correct_answer: 0

- question: Яка частота радіолінку задана на цьому віджеті?
  image: /imgs/radio_widget.png
  options:
  - 3 МГц
  - 116 МГц
  - 600 МГц
  correct_answer: 2

- question: Що означає «+3m» біля маркерів на віджеті?
  image: /imgs/radio_widget.png
  options:
  - Висоту антени над поверхнею землі
  - Похибку координат
  - Висоту над рівнем моря
  correct_answer: 0
  stick_to_the_previous: true

- question: Що означає «116 dB LOS» внизу віджета?
  image: /imgs/radio_widget.png
  options:
  - Втрати сигналу на шляху і тип радіолінку — пряма видимість
  - Потужність передавача
  - Відстань між антенами
  correct_answer: 0
  stick_to_the_previous: true

- question: Втрати сигналу на віджеті більші, ніж бюджет вашого радіолінку. Що це означає?
  options:
  - Зв'язок буде, але повільний
  - Зв'язку не буде
  - Треба зменшити висоту антен
  correct_answer: 1

- question: Що саме рахує віджет радіолінку?
  options:
  - Повний бюджет лінку з урахуванням ваших антен
  - Тільки втрати сигналу в просторі. Підсилення і втрати ваших антен треба додати самому
  - Тільки відстань
  correct_answer: 1

- question: Що буде, якщо перешкода перекриває 60% зони Френеля?
  options:
  - Зв'язок буде незадовільний
  - Зв'язок стане кращим
  - Нічого не зміниться
  correct_answer: 0

- question: Чи враховує віджет дощ і туман на частотах до 3 ГГц?
  options:
  - Так, завжди
  - Ні, на таких частотах опади майже не впливають
  correct_answer: 1

- question: Для яких частот підходить тип радіолінку LOS (пряма видимість)?
  options:
  - До 3 МГц
  - Від 3 до 30 МГц
  - Понад 30 МГц
  correct_answer: 2

