title: "Кропива: кодовані зони"
questions:
- question: Для чого потрібні кодовані зони?
  image: /imgs/zones_panel.png
  options:
  - Щоб показати на мапі зони обстрілу
  - Щоб безпечно передавати координати відкритими каналами зв'язку
  - Щоб обмежити, яку частину карти видно
  correct_answer: 1

- question: Як передати кодовану зону на інший пристрій?
  options:
  - Ніяк. На кожному пристрої треба створити точно таку саму зону
  - Через додаток «Тенета Групи»
  - Разом з експортом сцени
  correct_answer: 0

- question: Що має збігатися, коли ви створюєте ту саму зону на різних пристроях? Оберіть усі правильні варіанти.
  options:
  - Назва зони
  - Колір зони
  - Позначки «Цифрова» і «Коротка»
  - Пароль
  - Координати центру зони
  - Час створення зони
  correct_answer:
  - 0
  - 1
  - 2
  - 3
  - 4
  stick_to_the_previous: true

- question: Як кодуються координати, якщо позначку «Цифрова» НЕ поставити?
  image: /imgs/zones_digital.png
  options:
  - Літерами й цифрами, щоб передавати їх фонетичним алфавітом НАТО
  - Тільки цифрами
  - Координати не кодуються
  correct_answer: 0

- question: Яку зону радять використовувати для передачі координат по радіо?
  options:
  - Цифрову
  - Нецифрову (з літерами й цифрами)
  - Немає різниці
  correct_answer: 1
  stick_to_the_previous: true

- question: Що означає позначка «Коротка»?
  image: /imgs/zones_short.png
  options:
  - Зона з радіусом 100 км навколо центру, який ви задаєте
  - Зона діє тільки одну добу
  - Коротший пароль
  correct_answer: 0

- question: Яку площу охоплює зона, якщо позначку «Коротка» НЕ поставити?
  options:
  - 10 км
  - 100 км
  - Усю земну поверхню
  correct_answer: 2
  stick_to_the_previous: true

- question: Після створення зону перевіряють, передаючи кодовані координати. Яка найбільша різниця між реальними координатами вважається нормою?
  options:
  - До 10 метрів
  - До 100 метрів
  - До 1 кілометра
  correct_answer: 0

- question: Ви вимкнули обидва перемикачі, виділені на зображенні. Чи перестали працювати кодовані зони?
  image: /imgs/zones_toggles.png
  options:
  - Так, зони вимкнулися
  - Ні, перемикачі змінюють тільки те, що видно на екрані
  - Зони видалилися
  correct_answer: 1

- question: Що показано в червоному полі, виділеному на зображенні?
  image: /imgs/zones_coded.png
  options:
  - Пароль зони «три»
  - Позивний користувача
  - Кодовані координати цілевказівника в зоні «три»
  correct_answer: 2

- question: На двох пристроях з однаковою зоною ті самі координати показуються різними кодами. Це помилка?
  options:
  - Так, зону створили з помилкою
  - Ні, одні координати можуть мати багато різних кодів
  correct_answer: 1

- question: Вам передали кодовані координати. Як перейти до цієї точки?
  options:
  - Функції → Перейти на координати → «Кодовані координати» → вибрати зону → ввести код → «Перейти»
  - Вставити код у глобальний пошук
  - Карта → Регіон → ввести код
  correct_answer: 0

- question: Як передати по радіо літеру Q фонетичним алфавітом НАТО? Напишіть слово.
  correct_value: Quebec
  checker: |
    assert user_answer.strip().lower() in ('quebec', 'кебек', 'квебек'), 'Правильна відповідь: Quebec'

- question: Як передати по радіо код «CS» фонетичним алфавітом НАТО?
  options:
  - Charlie Sierra
  - Charlie Sugar
  - Cobra Sierra
  correct_answer: 0

randomize_questions: false
show_answers_on_completion: false
show_right_answer: true
