title: "Кропива: перехід на координати і пошук міст"
questions:
- question: Як відкрити це вікно?
  image: /imgs/goto_panel.png
  options:
  - Функції → Перейти на координати
  - Карта → Регіон
  - ТОПО → ПГЗ
  correct_answer: 0

- question: Що робить кнопка, виділена на зображенні?
  image: /imgs/goto_paste.png
  options:
  - Копіює координати цілевказівника
  - Вставляє координати з буфера обміну, а систему координат визначає сама
  - Відкриває блокнот
  correct_answer: 1

- question: Що робить кнопка, виділена на зображенні?
  image: /imgs/goto_add.png
  options:
  - Додає нову систему координат
  - Збільшує масштаб карти
  - Створює об'єкт ієрархії або тактичну позначку за координатами, куди перейшов цілевказівник
  correct_answer: 2

- question: Що робить кнопка, виділена на зображенні?
  image: /imgs/goto_print.png
  options:
  - Друкує карту (зберігає ділянку карти у файл)
  - Робить фото камерою планшета
  - Сканує QR-код
  correct_answer: 0

- question: Як автоматично називається файл друку карти?
  options:
  - map_snapshot_<дата та час>.pdf
  - kropyva_<назва сцени>.png
  - print_<номер>.jpg
  correct_answer: 0
  stick_to_the_previous: true

- question: Для чого поле «Пошук — З тексту» внизу цього вікна?
  image: /imgs/goto_panel.png
  options:
  - Щоб шукати населений пункт за назвою
  - Щоб вставити текст повідомлення, а Кропива сама знайде в ньому координати
  - Щоб шукати об'єкти в сцені
  correct_answer: 1

- question: Що станеться, якщо ДОВГО натиснути на цифри координат у полі введення?
  options:
  - Координати скопіюються в буфер обміну
  - Карта перейде на ці координати
  - Координати видаляться
  correct_answer: 0

- question: А що станеться, якщо КОРОТКО натиснути на цифри координат?
  options:
  - Координати скопіюються в буфер обміну
  - Карта перейде на ці координати
  - Відкриється вибір системи координат
  correct_answer: 1
  stick_to_the_previous: true

- question: Ви ввели координати, але не ввели висоту H. Яку висоту візьме Кропива?
  options:
  - Висоту з карти висот, а якщо її немає — 0
  - Завжди 0
  - Висоту вашого планшета за GPS
  correct_answer: 0

- question: Куди перейде цілевказівник, якщо вибрати населений пункт у «Перейти до міста»?
  image: /imgs/city_goto.png
  options:
  - На найближчу дорогу
  - На історичне середмістя (центр) населеного пункту
  - На вашу геопозицію
  correct_answer: 1

- question: Що показує список «Знайти найближчі місця»?
  image: /imgs/city_nearest.png
  options:
  - Найближчі населені пункти до координат, відстань до них і напрямок
  - Найближчі цілі з бойового порядку
  - Історію переходів
  correct_answer: 0

- question: Що показують стрілки біля назв населених пунктів?
  image: /imgs/city_nearest.png
  options:
  - Напрямок вітру
  - У який бік від вказаних координат лежить населений пункт
  - Чи росте населений пункт
  correct_answer: 1
  stick_to_the_previous: true

randomize_questions: false
show_answers_on_completion: false
show_right_answer: true
